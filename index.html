<html lang="en">

<head>
    <meta charset="utf-8">
    <title>TITLE</title>
    <style>
        html,
        body,
        canvas {
            margin: 0px;
            padding: 0px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            background: rgb(24 24 24);
            z-index: 0;
        }

        canvas {
            inset: 0;
        }

        button,
        label {
            position: relative;
            z-index: 1;
            color: white;
        }
    </style>
</head>

<body>
<audio id="audio" src="audio.mp3" autoplay></audio>
<button id="play-pause" type="button">Play / pause</button>
<label>
    Playback volume
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.25">
</label>
<script>
    /** @type {HTMLAudioElement} */
    const audio = document.getElementById("audio");
    const playPause = document.getElementById("play-pause");
    const volume = document.getElementById("volume");
</script>

<canvas id="glcanvas" tabindex='1'></canvas>
<!-- Minified and statically hosted version of https://github.com/not-fl3/macroquad/blob/master/js/mq_js_bundle.js -->
<script src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"></script>
<script src="audio.js"></script>
<script>
    load("target/wasm32-unknown-unknown/debug/web_audio_visualizer.wasm");

    const audioContext = new AudioContext();
    const rawAudio = audioContext.createMediaElementSource(audio);
    const playbackVolume = audioContext.createGain();

    // Rust taps rawAudio before playbackVolume, so changing this gain does not
    // alter the samples Rust receives.
    rawAudio.connect(playbackVolume);
    playbackVolume.connect(audioContext.destination);
    playbackVolume.gain.value = Number(volume.value);

    playPause.addEventListener("click", () => {
        audio.paused ? audio.play() : audio.pause();
    });
    volume.addEventListener("input", () => {
        playbackVolume.gain.value = Number(volume.value);
    });
    audio.addEventListener("play", () => audioContext.resume());
    setAudioStream(rawAudio);
</script>
</body>

</html>
